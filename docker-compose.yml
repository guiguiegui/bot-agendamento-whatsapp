services:
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    volumes:
      - redis-data:/data

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    env_file: .env
    environment:
      # dentro da rede do compose o Redis se chama "redis", não "localhost"
      REDIS_URL: redis://redis:6379
      # regras de horário de funcionamento usam Date local — fixa o fuso
      # independente do host onde o container rodar
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
    # a Baileys imprime o QR code de conexão no log, na primeira vez:
    #   docker compose logs -f bot
    stdin_open: true
    tty: true

volumes:
  redis-data:
