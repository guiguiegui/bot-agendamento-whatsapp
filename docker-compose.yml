services:
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    volumes:
      - redis-data:/data

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    env_file: .env
    environment:
      # dentro da rede do compose o Redis se chama "redis", não "localhost"
      REDIS_URL: redis://redis:6379
      # regras de horário de funcionamento usam Date local — fixa o fuso
      # independente do host onde o container rodar
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
    # a Baileys imprime o QR code de conexão no log, na primeira vez:
    #   docker compose logs -f bot
    stdin_open: true
    tty: true

volumes:
  redis-data:
