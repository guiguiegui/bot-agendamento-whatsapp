name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit (vulnerabilidades alta/crítica em dependências)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (domínio, máquina de estados, SQLite)
        run: npm test

      - name: Build
        run: npm run build
