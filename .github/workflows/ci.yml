name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit (vulnerabilidades alta/crítica em dependências)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (domínio, máquina de estados, SQLite)
        run: npm test

      - name: Build
        run: npm run build
